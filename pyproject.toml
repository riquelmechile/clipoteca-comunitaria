[project]
name = "clipoteca"
version = "0.1.0"
description = "Pipeline serverless de Clipoteca Comunitaria"
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.28,<0.29",
  "jsonschema>=4.25,<5",
  "Pillow>=12,<13",
  "ImageHash>=4.3,<5",
  "numpy>=2.3,<3",
]

[project.optional-dependencies]
translate = ["argostranslate==1.10.0"]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2", "respx>=0.22,<0.23", "ruff>=0.14,<0.15", "pytest-socket>=0.7,<0.8"]

[project.scripts]
clipoteca = "clipoteca.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline/clipoteca"]

[tool.pytest.ini_options]
addopts = "--disable-socket"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

