[project]
name = "clipoteca"
version = "3.0.0"
description = "Pipeline serverless de Clipoteca Comunitaria"
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.28,<0.29",
  "jsonschema>=4.25,<5",
  "Pillow>=12,<13",
  "ImageHash>=4.3,<5",
  "numpy>=2.3,<3",
]

[project.optional-dependencies]
translate = ["argostranslate==1.10.0"]
tiktok = ["playwright==1.65.2"]
embeddings = ["sentence-transformers>=5.1,<6", "torch>=2.8,<3"]
studio = [
  "sherpa-onnx==1.13.8",
  # sherpa-onnx declares this only in its wheel metadata, which the lock resolver does not see;
  # without it `import sherpa_onnx` fails with a missing libonnxruntime.so.
  "sherpa-onnx-core==1.13.8",
  "faster-whisper==1.2.1",
  "ctranslate2==4.9.0",
  "onnxruntime==1.31.1",
  "scipy",
  "soundfile",
  "phonemizer-fork==3.3.2",
  "espeakng-loader==0.2.4",
  "num2words==0.5.14",
  "playwright==1.65.2",
  "tokenizers==0.23.3",
  "opencv-python-headless==5.0.0.93",
  "rapidocr-onnxruntime==1.2.3",
]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2", "respx>=0.22,<0.23", "ruff>=0.14,<0.15", "pytest-socket>=0.7,<0.8", "PyYAML>=6.0,<7"]

[project.scripts]
clipoteca = "clipoteca.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline/clipoteca"]

[tool.pytest.ini_options]
addopts = "--disable-socket --allow-unix-socket"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
