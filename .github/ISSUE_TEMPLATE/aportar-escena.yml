name: Aportar escena
description: Proponer una URL de video para el pipeline comunitario futuro
title: "[Escena]: "
labels: ["contribution"]
body:
  - type: markdown
    attributes:
      value: La ingesta automática se implementará en un hito posterior. No incluyas secretos.
  - type: input
    id: url
    attributes:
      label: URL de descarga accesible
      placeholder: https://example.org/video.mp4
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Título o descripción breve
  - type: input
    id: tags
    attributes:
      label: Etiquetas opcionales
