name: "Aportar escena"
description: "Sugiere un vídeo público; un humano verifica su licencia y seguridad antes de importarlo."
title: "[Aporte pendiente] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Esta solicitud NO autoriza descargar ni republicar automáticamente un vídeo.
        Usa una URL HTTPS pública. No pegues credenciales ni URLs privadas.
  - type: input
    id: source_url
    attributes:
      label: "URL pública del vídeo"
      description: "Enlace al origen, no dirección de una red interna."
      placeholder: "https://example.org/video"
    validations:
      required: true
  - type: input
    id: scene_title
    attributes:
      label: "Título descriptivo de la escena"
      placeholder: "Lluvia sobre una calle"
    validations:
      required: true
  - type: checkboxes
    id: permissions
    attributes:
      label: "Derechos de uso"
      options:
        - label: "Confirmo que cuento con autorización para proponer este material; acepto revisión humana."
          required: true
  - type: textarea
    id: notes
    attributes:
      label: "Notas de procedencia y licencia"
      description: "Detalles opcionales para que un revisor verifique derechos."
    validations:
      required: false
