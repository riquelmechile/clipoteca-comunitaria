name: "Aportar escena"
description: "Comparte un enlace directo HTTPS a video para que Clipoteca lo procese automáticamente."
title: "[Aporte pendiente] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        La ingesta se inicia automáticamente al crear o editar este Issue.
        Introduce una URL HTTPS pública directa a MP4, WebM u OGV.
        No agregues credenciales, información privada ni enlaces internos.
  - type: input
    id: source_url
    attributes:
      label: "URL pública del vídeo"
      description: "Archivo de video directo; no página HTML."
      placeholder: "https://videos.example.org/escena.mp4"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: "Notas de procedencia"
      description: "Contexto factual opcional de la escena."
    validations:
      required: false
