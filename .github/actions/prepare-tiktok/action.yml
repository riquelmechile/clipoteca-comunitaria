name: Prepare optional TikTok browser
description: Install a cached Chromium only when a TikTok session is configured
runs:
  using: composite
  steps:
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/ms-playwright
        key: clipoteca-tiktok-chromium-${{ runner.os }}-${{ hashFiles('uv.lock') }}
    - name: Install optional browser with bounded dependencies
      shell: bash
      run: |
        if [ -n "$TIKTOK_COOKIE" ]; then
          if [ "$TIKTOK_WITH_TRANSLATE" = "1" ]; then
            uv sync --frozen --extra translate --extra tiktok
          else
            uv sync --frozen --extra tiktok
          fi
          uv run --no-sync python -m playwright install --with-deps chromium
        fi
