name: Live provider smoke and usage evidence

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Probe mode (all = search + candidates; downloads = bounded real downloads, nothing published)
        required: false
        default: all
        type: choice
        options:
          - all
          - downloads

permissions:
  contents: read

jobs:
  smoke:
    if: github.repository == 'riquelmechile/clipoteca-comunitaria' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - name: Prepare optional TikTok Chromium
        uses: ./.github/actions/prepare-tiktok
        env:
          TIKTOK_COOKIE: ${{ secrets.TIKTOK_COOKIE }}
          TIKTOK_WITH_TRANSLATE: "0"
      - name: Install FFmpeg for bounded download probes
        if: inputs.mode == 'downloads'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Probe sources across four languages without publishing media
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          DOUYIN_ACCESS_TOKEN: ${{ secrets.DOUYIN_ACCESS_TOKEN }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_COOKIE: ${{ secrets.TIKTOK_COOKIE }}
          DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID }}
          SNAPCHAT_ACCESS_TOKEN: ${{ secrets.SNAPCHAT_ACCESS_TOKEN }}
          SNAPCHAT_PROFILE_ID: ${{ vars.SNAPCHAT_PROFILE_ID }}
          BILIBILI_COOKIE: ${{ secrets.BILIBILI_COOKIE }}
          PEERTUBE_ALLOWED_INSTANCES: ${{ vars.PEERTUBE_ALLOWED_INSTANCES }}
          SMOKE_MODE: ${{ inputs.mode || 'all' }}
        run: uv run --no-sync python scripts/smoke_sources.py --mode "$SMOKE_MODE" --output "data/reports/smoke-$GITHUB_RUN_ID.json"
      - name: Preserve measured results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clipoteca-smoke-${{ github.run_id }}
          path: data/reports/
          if-no-files-found: warn
          retention-days: 30
