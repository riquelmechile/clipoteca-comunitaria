name: Relocalize existing clip metadata (no media uploads)

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Existing clip IDs separated by spaces, e.g. clip-000002 clip-000003"
        required: true
        type: string
      language_overrides:
        description: "Optional ID:language pairs, e.g. clip-000002:es"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: clipoteca-catalog
  cancel-in-progress: false

jobs:
  relocalize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
      - name: Prepare verified translation resources
        uses: ./.github/actions/prepare-translations
      - name: Rebuild ES/EN metadata only
        env:
          ARGOS_MODEL_CACHE_DIR: .cache/argos
          ARGOS_MODEL_PINS_JSON: data/argos-pins.json
          CLIPOTECA_IDS: ${{ inputs.ids }}
          CLIPOTECA_OVERRIDES: ${{ inputs.language_overrides }}
        run: |
          uv run python -m clipoteca relocalize \
            --ids "$CLIPOTECA_IDS" \
            --language-overrides "$CLIPOTECA_OVERRIDES"
      - name: Commit catalogue text and regenerated indexes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/clips.json data/index/
          if ! git diff --cached --quiet; then
            git commit -m 'fix(metadata): relocalize existing verified clips'
            uv run python scripts/push_catalog_rebase.py
          fi
