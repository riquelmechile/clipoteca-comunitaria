name: Public media ingestion
on:
  workflow_dispatch:
    inputs:
      upload_id:
        description: Public upload reference
        required: true
        type: string
      capability:
        description: Short-lived claim identifier (not a secret)
        required: true
        type: string
permissions: {}
jobs:
  ingest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          python-version: "3.13"
      - uses: ./.github/actions/install-ffmpeg
      - run: uv sync --frozen
      - name: Validate and register public upload
        env:
          UPLOAD_ID: ${{ inputs.upload_id }}
          UPLOAD_CAPABILITY: ${{ inputs.capability }}
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-sync python -m clipoteca.media_ingest
