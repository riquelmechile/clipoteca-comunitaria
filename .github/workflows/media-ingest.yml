name: Public media ingestion
on:
  workflow_dispatch:
    inputs:
      upload_id:
        description: Public upload reference
        required: true
        type: string
      capability:
        description: Short-lived claim identifier (not a secret)
        required: true
        type: string
permissions: {}
jobs:
  ingest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          python-version: "3.13"
      - uses: ./.github/actions/install-ffmpeg
      - name: Prepare verified translation resources (best effort)
        uses: ./.github/actions/prepare-translations
        continue-on-error: true
      - name: Sync the same pinned translation environment as real-argos (best effort)
        continue-on-error: true
        run: uv sync --frozen --extra translate --extra dev
      - name: Ensure base runtime if optional setup failed
        run: uv run --no-sync python -c 'import clipoteca, httpx, PIL' || uv sync --frozen
      - name: Diagnose raw Argos output (fixed synthetic sentence, best effort)
        continue-on-error: true
        env:
          ARGOS_MODEL_CACHE_DIR: .cache/argos
          ARGOS_MODEL_PINS_JSON: data/argos-pins.json
        run: uv run --no-sync python -m clipoteca.translate.probe_upload_translation
      - name: Check translation in ingestion environment (best effort)
        continue-on-error: true
        env:
          ARGOS_MODEL_CACHE_DIR: .cache/argos
          ARGOS_MODEL_PINS_JSON: data/argos-pins.json
        run: |
          uv run --no-sync python -c 'from clipoteca.media_ingest import enrich_metadata; source = "Un perro corriendo en el pasto"; result = enrich_metadata({"description": {"es": source}}); raise SystemExit(0 if result["description"].get("en") and result["description"]["en"].casefold() != source.casefold() and result["tags"].get("en") else 1)'
      - name: Validate and register public upload
        env:
          UPLOAD_ID: ${{ inputs.upload_id }}
          UPLOAD_CAPABILITY: ${{ inputs.capability }}
          GH_TOKEN: ${{ github.token }}
          ARGOS_MODEL_CACHE_DIR: .cache/argos
          ARGOS_MODEL_PINS_JSON: data/argos-pins.json
        run: uv run --no-sync python -m clipoteca.media_ingest
