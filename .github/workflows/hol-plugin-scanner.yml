# HOL AI Plugin Scanner: scores this repository on every push and pull request.
# - Read-only token, no secrets, checkout credentials are not persisted.
# - Every action is pinned to a full commit SHA; the scanner wheel is verified
#   against a committed SHA-256 and PyPI provenance before it runs.
# Guide: https://github.com/hashgraph-online/awesome-ai-plugins/blob/main/SCANNER_GUIDE.md
name: HOL Plugin Scanner

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hol-plugin-scanner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: HOL Plugin Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: hashgraph-online/ai-plugin-scanner-action@9a6d9e4f69118302d3d0b3013ec7a78c1ed52ea9 # v1.2.820
        with:
          plugin_dir: "."
          min_score: 75
          fail_on_severity: none
