name: Temporary v206 isolated discovery probe
on:
  push:
    branches: [fix/v2.0.6-discovery-fairness]
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - name: Live discovery only (no catalog, releases or job writes)
        env:
          CLIPOTECA_PERSIST_JOBS: "0"
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          PEERTUBE_ALLOWED_INSTANCES: ${{ vars.PEERTUBE_ALLOWED_INSTANCES }}
          BILIBILI_COOKIE: ${{ secrets.BILIBILI_COOKIE }}
        run: uv run --no-sync python scripts/v206_discovery_temporary.py
