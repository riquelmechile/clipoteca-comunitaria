name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.13"
      - uses: ./.github/actions/install-ffmpeg
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --diff .
      - run: uv run ruff format --check .
      - run: uv run pytest
  worker:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test


  real-argos:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.13"
      - name: Prepare verified translation resources
        uses: ./.github/actions/prepare-translations
      - run: uv sync --frozen --extra translate --extra dev
      - name: Real Argos Issue 26 and ordinary query
        env:
          ARGOS_REAL_INTEGRATION: "1"
          ARGOS_MODEL_CACHE_DIR: .cache/argos
          ARGOS_MODEL_PINS_JSON: data/argos-pins.json
        run: uv run --no-sync pytest tests/test_real_argos_issue26.py

  studio:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: ./.github/actions/install-ffmpeg
      - run: uv sync --frozen --extra dev --extra studio
      - name: Install Chromium for the offline music render
        run: uv run --no-sync playwright install --with-deps chromium
      - name: Studio tests with the studio extra installed (no model downloads)
        run: >-
          uv run --no-sync pytest -rs
          tests/test_voice_m26.py tests/test_studio_models_m26.py tests/test_timeline_m26.py
          tests/test_music_m27.py tests/test_video_script_m25.py
          tests/test_plan_m28.py tests/test_windows_m28.py tests/test_library_m28.py
          tests/test_clipscene_m28.py tests/test_framing_m28.py tests/test_checks_m28.py
          tests/test_fit_m29.py tests/test_mix_m29.py tests/test_compose_m30.py
          tests/test_qa_m31.py tests/test_import_m28.py tests/test_textnorm_r2.py
          tests/test_publish_m32.py
      - name: Real music render in headless Chromium (must not be skipped)
        run: |
          uv run --no-sync python -m clipoteca.studio.music render --plan tests/fixtures/m27/plan.json --out build/music-smoke
          test -s build/music-smoke/head.wav && test -s build/music-smoke/bed.wav && test -s build/music-smoke/hit.wav
          cat build/music-smoke/music.json
      - name: Image and repository SVG scenes (must not be skipped)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin
          mkdir -p build
          uv run --no-sync pytest -rs tests/test_image_motion.py | tee build/image-smoke.log
          ! grep -q SKIPPED build/image-smoke.log
      - name: Real HyperFrames render of a three-scene video (must not be skipped)
        env:
          CLIPOTECA_M30_REAL_RENDER: "1"
        run: |
          uv run --no-sync pytest -rs tests/test_compose_m30.py::test_real_three_scene_render | tee build/render-smoke.log
          grep -q "1 passed" build/render-smoke.log
      - name: Real QA layout gate in headless Chromium (must not be skipped)
        env:
          CLIPOTECA_M31_REAL_LAYOUT: "1"
        run: |
          uv run --no-sync pytest -rs tests/test_qa_m31.py::test_real_playwright_detects_outsafe_and_overlap | tee build/layout-smoke.log
          grep -q "1 passed" build/layout-smoke.log
