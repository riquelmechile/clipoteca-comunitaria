name: Approved community contribution ingest

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Open GitHub Issue with clipoteca-approved label"
        required: true
        type: string
      rights_confirmed:
        description: "After human rights and video URL review, enter yes"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: clipoteca-catalog
  cancel-in-progress: false

jobs:
  approved-ingest:
    if: github.ref == 'refs/heads/main' && github.event.inputs.rights_confirmed == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.13"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/argos
            ~/.local/share/argos-translate
          key: clipoteca-argos-v2-${{ hashFiles('uv.lock', 'data/argos-pins.json') }}
      - run: uv sync --frozen --extra translate
      - name: Verify Argos model signatures
        env:
          ARGOS_MODEL_CACHE_DIR: .cache/argos
          ARGOS_MODEL_PINS_JSON: data/argos-pins.json
        run: uv run python -m clipoteca.translate.download_models
      - name: Ingest only after review of verified direct media URL
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLIPOTECA_PERSIST_JOBS: "1"
          CLIPOTECA_ISSUE_NUMBER: ${{ inputs.issue_number }}
          CLIPOTECA_RIGHTS: ${{ inputs.rights_confirmed }}
          ARGOS_MODEL_CACHE_DIR: .cache/argos
          ARGOS_MODEL_PINS_JSON: data/argos-pins.json
        run: |
          uv run python -m clipoteca.contributions \
            --issue-number "$CLIPOTECA_ISSUE_NUMBER" \
            --rights-confirmed "$CLIPOTECA_RIGHTS"
