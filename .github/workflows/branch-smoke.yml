name: branch-smoke (temporary)
on:
  push:
    branches: ["claude/unblock"]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          BILIBILI_COOKIE: ${{ secrets.BILIBILI_COOKIE }}
          PEERTUBE_ALLOWED_INSTANCES: ${{ vars.PEERTUBE_ALLOWED_INSTANCES }}
        run: uv run python scripts/smoke_sources.py --mode downloads --output "data/reports/smoke-$GITHUB_RUN_ID.json"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: branch-smoke
          path: data/reports/smoke-${{ github.run_id }}.json
