name: Automatic community contribution ingest

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read

jobs:
  community-ingest:
    if: >-
      github.repository == 'riquelmechile/clipoteca-comunitaria' &&
      github.event.issue.state == 'open' &&
      !github.event.issue.pull_request &&
      startsWith(github.event.issue.title, '[Aporte pendiente] ')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
    concurrency:
      group: contribution-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/argos
            ~/.local/share/argos-translate
          key: clipoteca-argos-v2-${{ hashFiles('uv.lock', 'data/argos-pins.json') }}
      - run: uv sync --frozen --extra translate
      - name: Download pinned translation models
        env:
          ARGOS_MODEL_CACHE_DIR: .cache/argos
          ARGOS_MODEL_PINS_JSON: data/argos-pins.json
        run: uv run python -m clipoteca.translate.download_models
      - name: Process Issue as data through normal secure pipeline
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLIPOTECA_PERSIST_JOBS: "1"
          CLIPOTECA_ISSUE_NUMBER: ${{ github.event.issue.number }}
          ARGOS_MODEL_CACHE_DIR: .cache/argos
          ARGOS_MODEL_PINS_JSON: data/argos-pins.json
        run: uv run python -m clipoteca.contributions --issue-number "$CLIPOTECA_ISSUE_NUMBER"
      - name: Save job artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clipoteca-contribution-${{ github.event.issue.number }}-${{ github.run_id }}
          path: data/jobs/
          if-no-files-found: ignore
