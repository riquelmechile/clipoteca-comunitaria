name: Automatic community contribution ingest

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read

jobs:
  community-ingest:
    if: >-
      github.repository == 'riquelmechile/clipoteca-comunitaria' &&
      github.event.issue.state == 'open' &&
      !github.event.issue.pull_request &&
      startsWith(github.event.issue.title, '[Aporte pendiente] ')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
    concurrency:
      group: contribution-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Prepare verified translation resources
        uses: ./.github/actions/prepare-translations
      - name: Process Issue as data through normal secure pipeline
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLIPOTECA_PERSIST_JOBS: "1"
          CLIPOTECA_ISSUE_NUMBER: ${{ github.event.issue.number }}
          ARGOS_MODEL_CACHE_DIR: .cache/argos
          ARGOS_MODEL_PINS_JSON: data/argos-pins.json
        run: uv run --no-sync python -m clipoteca.contributions --issue-number "$CLIPOTECA_ISSUE_NUMBER"
      - name: Save job artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clipoteca-contribution-${{ github.event.issue.number }}-${{ github.run_id }}
          path: data/jobs/
          if-no-files-found: ignore
