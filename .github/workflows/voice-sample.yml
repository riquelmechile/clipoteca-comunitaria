name: Voice sample

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
      - name: Restore Studio models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/studio-models
          key: studio-models-${{ hashFiles('pipeline/clipoteca/studio/models.json') }}
      - run: uv sync --frozen --extra studio
      - name: Generate all voice samples
        env:
          CLIPOTECA_STUDIO_MODELS: .cache/studio-models
          CLIPOTECA_WHISPER_COMPUTE: int8
        run: uv run --no-sync python -m clipoteca.studio.voice sample --out build/voice-sample
      - name: Publish table
        run: cat build/voice-sample/sample.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload WAV and table
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voice-sample-${{ github.run_id }}
          path: build/voice-sample
          if-no-files-found: error
          retention-days: 30
