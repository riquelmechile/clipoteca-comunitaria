name: Voice sample

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.13"
      - name: Restore Studio models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/studio-models
          key: studio-models-${{ hashFiles('pipeline/clipoteca/studio/models.json') }}
      - run: uv sync --frozen --extra studio
      - name: Generate all voice samples
        env:
          CLIPOTECA_STUDIO_MODELS: .cache/studio-models
          CLIPOTECA_WHISPER_COMPUTE: int8
        run: uv run --no-sync python -m clipoteca.studio.voice sample --out build/voice-sample
      - name: Publish table
        run: cat build/voice-sample/sample.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload WAV and table
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voice-sample-${{ github.run_id }}
          path: build/voice-sample
          if-no-files-found: error
          retention-days: 30
