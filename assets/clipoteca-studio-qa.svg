<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
<title id="title">QA: catorce compuertas antes de publicar</title>
<desc id="desc">Seis grupos: estructura y layout, archivo y decodificación, imagen, audio, voz y subtítulos, y clips. Las catorce pruebas deben aprobar; el resultado incluye SHA-256 del MP4. Si una falla, no se publica.</desc>
<style>text{font-family:system-ui,Arial,sans-serif;fill:#F1F7FF;font-size:19px}.head{font-size:28px;font-weight:700}.label{font-size:22px;font-weight:700;fill:#67F5CF}.small{font-size:18px;fill:#C5D8EF}.node{fill:#101F3D;stroke:#5A9EF2;stroke-width:1.5}.gate{font-weight:700}.orange{fill:#FFB571;font-weight:700}</style>
<rect width="1000" height="660" rx="24" fill="#0B1731"/>
<text x="40" y="43" class="head">QA · 14 compuertas</text><text x="40" y="71" class="small">Todas deben aprobar. El reporte queda ligado al SHA-256 del MP4.</text>
<rect class="node" x="40" y="95" width="450" height="140" rx="12"/><text x="60" y="125" class="label">Estructura y layout</text><text x="60" y="155" class="gate">01 · hyperframes_check</text><text x="60" y="177" class="small">Sin errores de estructura</text><text x="60" y="203" class="gate">02 · layout_playwright</text><text x="60" y="225" class="small">Texto medible, sin desbordes ni solapes</text>
<rect class="node" x="510" y="95" width="450" height="140" rx="12"/><text x="530" y="125" class="label">Archivo y decodificación</text><text x="530" y="155" class="gate">03 · file_probe</text><text x="530" y="177" class="small">H.264 + AAC, ≤60 s y &lt;100 MB</text><text x="530" y="203" class="gate">04 · decode_clean</text><text x="530" y="225" class="small">FFmpeg sin errores ni stderr</text>
<rect class="node" x="40" y="250" width="450" height="140" rx="12"/><text x="60" y="280" class="label">Imagen</text><text x="60" y="310" class="gate">05 · blackdetect</text><text x="60" y="332" class="small">Sin negro detectado (≥0,1 s)</text><text x="60" y="358" class="gate">06 · freezedetect</text><text x="60" y="380" class="small">Sin congelación detectada (≥1 s)</text>
<rect class="node" x="510" y="250" width="450" height="140" rx="12"/><text x="530" y="280" class="label">Audio</text><text x="530" y="310" class="gate">07 · silencedetect</text><text x="530" y="332" class="small">Silencio solo en últimos 1,3 s</text><text x="530" y="358" class="gate">08 · loudness_ebur128</text><text x="530" y="380" class="small">−14 ±1 LUFS; pico ≤−0,9 dBFS</text>
<rect class="node" x="40" y="405" width="450" height="170" rx="12"/><text x="60" y="435" class="label">Voz y subtítulos</text><text x="60" y="465" class="gate">09 · whisper_wer</text><text x="60" y="487" class="small">WER ≤0,12</text><text x="60" y="513" class="gate">10 · subtitle_sync</text><text x="60" y="535" class="small">≥70 % de palabras emparejadas</text><text x="60" y="557" class="small">Media ≤120 ms; p95 ≤350 ms</text>
<rect class="node" x="510" y="405" width="450" height="170" rx="12"/><text x="530" y="435" class="label">Clips</text><text x="530" y="465">11 · clips_all_scenes: un video por escena</text><text x="530" y="489">12 · clips_unique: sin tramos ni pHash repetidos</text><text x="530" y="513">13 · clips_resolution: fuente y salida válidas</text><text x="530" y="537">14 · clips_black_freeze:</text><text x="550" y="559" class="small">Sin negro ≥0,3 s ni congelación ≥1,5 s</text>
<rect x="40" y="598" width="920" height="42" rx="10" fill="#101F3D" stroke="#FFB571"/><text x="60" y="625" class="orange">Si falla una compuerta: QA rechaza el video; no se publica.</text>
</svg>
