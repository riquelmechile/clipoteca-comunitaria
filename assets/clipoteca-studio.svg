<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="790" viewBox="0 0 1000 790" role="img" aria-labelledby="title desc">
<title id="title">Studio v3: del guion al video</title>
<desc id="desc">Guion validado, voz, música y escenas en paralelo; ensamblado, control de calidad y publicación. Los aportes del usuario alimentan las escenas y el índice de clips válidos es independiente.</desc>
