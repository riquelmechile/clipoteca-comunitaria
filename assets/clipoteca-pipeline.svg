<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="452" viewBox="0 0 1280 452" role="img" aria-labelledby="title desc">
<title id="title">Cómo funciona Clipoteca</title>
<desc id="desc">Seis pasos: consulta, servicio API, catálogo, búsqueda multilingüe, descarga y corte, publicación sin duplicados.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#67F5CF" stroke-width="2"/></marker></defs>
<rect width="1280" height="452" rx="30" fill="#0B1731"/>
<g font-family="DejaVu Sans,Arial,sans-serif" fill="#F1F7FF">
<text x="50" y="36" font-size="23" font-weight="bold">Cómo funciona Clipoteca</text>
<path d="M380 121H475" stroke="#67F5CF" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<path d="M805 121H900" stroke="#67F5CF" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<path d="M640 183V253H215V277" stroke="#67F5CF" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<path d="M380 342H475" stroke="#67F5CF" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<path d="M805 342H900" stroke="#67F5CF" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<path d="M1065 277V183" stroke="#67F5CF" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<rect x="50" y="59" width="330" height="124" rx="24" fill="#101F3D" stroke="#67F5CF" stroke-width="2"/>
<text x="70" y="94" font-size="23" font-weight="bold">01 · Consulta</text>
<text x="70" y="125" font-size="18" fill="#C5D8EF">Agente o persona</text>
<text x="70" y="149" font-size="18" fill="#C5D8EF">REST o MCP</text>
<rect x="475" y="59" width="330" height="124" rx="24" fill="#101F3D" stroke="#67F5CF" stroke-width="2"/>
<text x="495" y="94" font-size="23" font-weight="bold">02 · Servicio API</text>
<text x="495" y="125" font-size="18" fill="#C5D8EF">Recibe la consulta</text>
<text x="495" y="149" font-size="18" fill="#C5D8EF">Busca en el catálogo</text>
<rect x="900" y="59" width="330" height="124" rx="24" fill="#101F3D" stroke="#67F5CF" stroke-width="2"/>
<text x="920" y="94" font-size="23" font-weight="bold">03 · Catálogo</text>
<text x="920" y="125" font-size="18" fill="#C5D8EF">Si existe: entrega el clip</text>
<text x="920" y="149" font-size="18" fill="#C5D8EF">Respuesta inmediata</text>
<rect x="50" y="280" width="330" height="124" rx="24" fill="#101F3D" stroke="#67F5CF" stroke-width="2"/>
<text x="70" y="315" font-size="23" font-weight="bold">04 · Búsqueda</text>
<text x="70" y="346" font-size="18" fill="#C5D8EF">Español, inglés, chino, ruso</text>
<text x="70" y="370" font-size="18" fill="#C5D8EF">Fuentes públicas</text>
<rect x="475" y="280" width="330" height="124" rx="24" fill="#101F3D" stroke="#67F5CF" stroke-width="2"/>
<text x="495" y="315" font-size="23" font-weight="bold">05 · Procesamiento</text>
<text x="495" y="346" font-size="18" fill="#C5D8EF">Descarga y corte con FFmpeg</text>
<text x="495" y="370" font-size="18" fill="#C5D8EF">Hasta 20 segundos</text>
<rect x="900" y="280" width="330" height="124" rx="24" fill="#101F3D" stroke="#67F5CF" stroke-width="2"/>
<text x="920" y="315" font-size="23" font-weight="bold">06 · Publicación</text>
<text x="920" y="346" font-size="18" fill="#C5D8EF">GitHub Releases</text>
<text x="920" y="370" font-size="18" fill="#C5D8EF">Sin duplicados</text>
<text x="655" y="213" font-size="18" fill="#FFB571">Si falta el clip</text>
<circle r="6" fill="#67F5CF"><animateMotion dur="5s" repeatCount="indefinite" path="M215 121H1065"/></circle><circle r="6" fill="#FFB571"><animateMotion dur="12s" repeatCount="indefinite" path="M640 121V253H215V342H1065V121"/></circle>
</g></svg>
