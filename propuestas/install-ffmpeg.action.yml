name: Install ffmpeg
description: Fixed, digest-verified Linux x64 binaries; bounded apt fallback.
outputs:
  seconds:
    description: Elapsed seconds for installing and verifying FFmpeg
    value: ${{ steps.install.outputs.seconds }}
runs:
  using: composite
  steps:
    - shell: bash
      id: install
      run: |
        set -o pipefail
        SECONDS=0
        # Digests from https://api.github.com/repos/eugeneware/ffmpeg-static/releases/tags/b6.1.1
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        bin="$RUNNER_TEMP/clipoteca-ffmpeg-b6.1.1"
        if [ "$(uname -m)" = x86_64 ] &&
           curl -fsSL --proto '=https' --proto-redir '=https' --max-time 90 \
             https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-linux-x64 \
             -o "$tmp/ffmpeg" &&
           curl -fsSL --proto '=https' --proto-redir '=https' --max-time 90 \
             https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffprobe-linux-x64 \
             -o "$tmp/ffprobe" &&
           (cd "$tmp" && printf '%s\n' \
             'e7e7fb30477f717e6f55f9180a70386c62677ef8a4d4d1a5d948f4098aa3eb99  ffmpeg' \
             '4f231a1960d83e403d08f7971e271707bec278a9ae18e21b8b5b03186668450d  ffprobe' \
             | sha256sum -c --strict -) &&
           chmod 0755 "$tmp/ffmpeg" "$tmp/ffprobe" &&
           "$tmp/ffmpeg" -version && "$tmp/ffprobe" -version; then
          mkdir -p "$bin"
          install -m 0755 "$tmp/ffmpeg" "$tmp/ffprobe" "$bin/"
          echo "$bin" >> "$GITHUB_PATH"
          echo "seconds=$SECONDS" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "::warning::static ffmpeg unavailable or verification failed; using apt"
        sudo rm -f /var/lib/man-db/auto-update
        for attempt in 1 2 3; do
          if timeout 240 sudo apt-get update -qq \
            && timeout 420 sudo apt-get install -y -qq ffmpeg; then
            ffmpeg -version
            ffprobe -version
            echo "seconds=$SECONDS" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::warning::apt attempt $attempt failed or timed out"
          sudo pkill -9 -x apt-get || true
          sudo pkill -9 -x dpkg || true
          timeout 120 sudo dpkg --configure -a || true
          sleep 10
        done
        echo "::error::could not install ffmpeg after 3 attempts"
        exit 1
