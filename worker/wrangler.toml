name = "clipoteca-worker"
main = "src/index.ts"
compatibility_date = "2026-11-20"

# Set account_id and routes in deployment environment.
[vars]
CATALOG_TTL_SECONDS = "10"
CLIPOTECA_GITHUB_REPO = "riquelmechile/clipoteca-comunitaria"
# MCP_ALLOWED_HOSTS optional: defaults to the actual Worker request hostname.
# MCP_ALLOWED_HOSTS = "clipoteca.example.org"
# MCP_ALLOWED_ORIGINS = "https://your-client.example.org"

[[kv_namespaces]]
binding = "UPLOADS"
id = "2667a7657aa54bd68bf88e14748bc685"

[[durable_objects.bindings]]
name = "UPLOAD_CONTROL"
class_name = "UploadControl"

[[migrations]]
tag = "media-upload-control-v1"
new_sqlite_classes = ["UploadControl"]
