openapi: 3.1.0
info:
  title: Clipoteca Comunitaria REST API
  version: 3.1.0
  description: |
    Public catalogue/search and Issue contributions. Authenticated imports use
    a write bearer token. Video rendering uses the same token but a separate best-effort quota (one per
    five minutes, 12 per UTC day per IP); a private
    capability ID authorizes status and file access. MCP uses Streamable HTTP.
components:
  securitySchemes:
    writeToken:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
    VideoRequest:
      type: object
      additionalProperties: false
      required: [script]
      properties:
        script: {$ref: "../schemas/video.schema.json"}
        index_clips: {type: boolean, default: true}
    VideoAccepted:
      type: object
      required: [id, status, status_url]
      properties:
        id: {type: string, pattern: "^[a-f0-9]{32}$"}
        status: {const: queued}
        status_url: {type: string, format: uri}
    VideoStatus:
      type: object
      required: [id, status]
      properties:
        id: {type: string, pattern: "^[a-f0-9]{32}$"}
        status: {enum: [queued, running, done, failed, expired]}
        stages: {type: object}
        qa:
          type: object
          required: [pass, failed]
          properties:
            pass: {type: boolean}
            failed: {type: array, items: {type: string}}
        clips_indexed: {type: array, items: {type: string}}
        file_url: {type: string, format: uri}
        warnings: {type: array, items: {type: string}}
    Filters:
      type: object
      additionalProperties: false
      properties:
        aspect_ratio: {type: [string, "null"], enum: ["9:16", "16:9", "1:1", other, null]}
        max_duration: {type: number, exclusiveMinimum: 0, maximum: 20}
        min_width: {type: integer, minimum: 1}
        fps: {type: number, exclusiveMinimum: 0}
        source: {type: string, pattern: "^[a-z0-9_]{1,64}$"}
        language: {type: string, enum: [es, en, zh, ru]}
        has_audio: {type: boolean}
        limit: {type: integer, minimum: 1, maximum: 100}
        cursor: {type: string, pattern: "^(0|[1-9][0-9]*)$"}
        import_if_missing: {type: boolean}
    SearchBody:
      type: object
      required: [query]
      additionalProperties: false
      properties:
        query: {type: string, minLength: 1, maxLength: 200}
        filters: {$ref: "#/components/schemas/Filters"}
    SearchResponse:
      type: object
      required: [clips, next_cursor]
      properties:
        clips: {type: array, items: {type: object}}
        next_cursor: {type: [string, "null"]}
        request_id: {type: string, pattern: "^[0-9a-f]{64}$"}
        status: {type: string}
        semantic:
          type: string
          enum: [ready, pending, unavailable]
        semantic_reason:
          type: string
          description: Causa del fallback o shard aislado (sin datos sensibles).
          enum: [semantic_disabled, empty_corpus, query_vector_unavailable, query_encoder_unavailable, shard_corrupt, manifest_too_large, cpu_budget_exceeded, manifest_invalid, semantic_error, legacy_index_invalid, invalid_repository, query_vector_invalid, unsafe_query_encoder_url, no_semantic_match, query_vector_budget_exceeded]
        scores:
          type: object
          description: Puntuacion combinada RRF por ID de clip, opcional.
          additionalProperties: {type: number, minimum: 0}
    Job:
      type: object
      required: [request_id, status]
      properties:
        request_id: {type: string, pattern: "^[0-9a-f]{64}$"}
        status:
          type: string
          enum: [queued, searching, fetching, processing, publishing, published,
            duplicate, no_results, failed, rate_limited, unavailable, dead_letter]
        attempt: {type: integer, minimum: 1}
        updated_at: {type: string, format: date-time}
    SourceCapability:
      type: string
      enum: [supported, best_effort, unavailable]
      description: Declared capability, not an observed success or license grant.
    SourceCapabilities:
      type: object
      additionalProperties: false
      required: [search, preview, download]
      properties:
        search: {$ref: "#/components/schemas/SourceCapability"}
        preview: {$ref: "#/components/schemas/SourceCapability"}
        download: {$ref: "#/components/schemas/SourceCapability"}
    SourceRow:
      type: object
      additionalProperties: false
      required: [provider, status, capabilities]
      properties:
        provider: {type: string, minLength: 1}
        status: {type: string, minLength: 1}
        capabilities: {$ref: "#/components/schemas/SourceCapabilities"}
    SourcesResponse:
      type: object
      additionalProperties: false
      required: [sources, kind]
      properties:
        sources:
          type: array
          items: {$ref: "#/components/schemas/SourceRow"}
        kind: {type: string, enum: [actions_credential_presence_snapshot]}
    StoryboardFrame:
      type: object
      additionalProperties: false
      required: [url, index, timestamp_seconds]
      properties:
        url: {type: string, format: uri}
        index: {type: integer, minimum: 0}
        timestamp_seconds: {type: number, minimum: 0}
    StoryboardResponse:
      type: object
      additionalProperties: false
      required: [clip_id, frames]
      properties:
        clip_id: {type: string, pattern: "^clip-[0-9]{6}$"}
        frames: {type: array, maxItems: 8, items: {$ref: "#/components/schemas/StoryboardFrame"}}
    ScriptScene:
      type: object
      additionalProperties: false
      required: [id, narration, query, orientation, min_duration]
      properties:
        id: {type: string, pattern: "^[A-Za-z0-9_-]{1,64}$"}
        narration: {type: string, minLength: 1, maxLength: 1500}
        query: {type: string, minLength: 1, maxLength: 200}
        orientation:
          type: string
          enum: ["9:16", "16:9", "1:1", other, portrait, vertical, landscape, horizontal, square]
        min_duration: {type: number, exclusiveMinimum: 0, maximum: 20}
    ScriptRequest:
      type: object
      additionalProperties: false
      required: [scenes]
      properties:
        scenes:
          type: array
          minItems: 1
          maxItems: 50
          items: {$ref: "#/components/schemas/ScriptScene"}
    ScriptMedia:
      type: object
      additionalProperties: false
      required: [type, clip_id, url, thumbnail_url, storyboard_urls, duration_seconds, source]
      properties:
        type: {type: string, const: video}
        clip_id: {type: string, pattern: "^clip-[0-9]{6}$"}
        url: {type: string, format: uri}
        thumbnail_url: {type: [string, "null"], format: uri}
        storyboard_urls: {type: array, items: {type: string, format: uri}}
        duration_seconds: {type: number, exclusiveMinimum: 0}
        source:
          type: object
          required: [provider, source_language]
          properties:
            provider: {type: string}
            source_language: {type: string}
            provider_id: {type: string}
            source_title: {type: string}
            source_url: {type: string, format: uri}
            source_start: {type: number, minimum: 0}
            source_end: {type: number, exclusiveMinimum: 0}
    ScriptResolvedScene:
      type: object
      required: [id, narration, query, orientation, min_duration, status, media]
      properties:
        id: {type: string, pattern: "^[A-Za-z0-9_-]{1,64}$"}
        narration: {type: string, minLength: 1, maxLength: 1500}
        query: {type: string, minLength: 1, maxLength: 200}
        orientation: {type: string}
        min_duration: {type: number, exclusiveMinimum: 0, maximum: 20}
        status: {type: string, enum: [matched, queued, missing]}
        reason: {type: string}
        semantic_reason: {type: string}
        media:
          oneOf:
            - {$ref: "#/components/schemas/ScriptMedia"}
            - {type: "null"}
        request_id: {type: string, pattern: "^[a-f0-9]{64}$"}
        job:
          type: object
          required: [request_id, status]
          properties:
            request_id: {type: string, pattern: "^[a-f0-9]{64}$"}
            status: {type: string}
    ScriptResponse:
      type: object
      additionalProperties: false
      required: [script_id, scenes, summary]
      properties:
        script_id: {type: string, pattern: "^[a-f0-9]{64}$"}
        scenes:
          type: array
          minItems: 1
          maxItems: 50
          items: {$ref: "#/components/schemas/ScriptResolvedScene"}
        summary:
          type: object
          required: [matched, queued, missing, reused]
          properties:
            matched: {type: integer, minimum: 0}
            queued: {type: integer, minimum: 0}
            missing: {type: integer, minimum: 0}
            reused: {type: integer, minimum: 0}
    ContributionBody:
      type: object
      additionalProperties: false
      required: [title, url]
      properties:
        title: {type: string, minLength: 3, maxLength: 120}
        url: {type: string, format: uri, description: "Public direct HTTPS MP4/WebM/OGV"}
        notes: {type: string, maxLength: 1000}
paths:
  /v1/health:
    get:
      operationId: health
      description: Checks actual catalogue access and the MCP server's startup.
      responses:
        "200": {description: All checks ready}
        "503": {description: A check unavailable}
        "405": {description: Method not allowed}
  /v1/sources:
    get:
      operationId: listSources
      description: |
        Public source snapshot from data/sources.json on main. Each source has
        an observed credential-presence status and a DECLARED matrix of search,
        preview and download capabilities. "supported" is not proof of a live
        test, and "unavailable" is explicit; malformed rows cause HTTP 503.
        The endpoint never reveals secret values.
      responses:
        "200":
          description: Source rows and declared capability matrix
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SourcesResponse"}
        "405": {description: Method not allowed}
        "503": {description: Missing or invalid source snapshot}
  /v1/clips:
    get:
      operationId: listClips
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: aspect_ratio, in: query, schema: {type: string, enum: ["9:16", "16:9", "1:1", other]}}
        - {name: max_duration, in: query, schema: {type: number, exclusiveMinimum: 0, maximum: 20}}
        - {name: min_width, in: query, schema: {type: integer, minimum: 1}}
        - {name: fps, in: query, schema: {type: number, exclusiveMinimum: 0}}
        - {name: source, in: query, schema: {type: string}}
        - {name: language, in: query, schema: {type: string, enum: [es,en,zh,ru]}}
        - {name: has_audio, in: query, schema: {type: boolean}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: cursor, in: query, schema: {type: string, pattern: "^(0|[1-9][0-9]*)$"}}
      responses:
        "200": {description: Paginated catalogue with items and next_cursor}
        "400": {description: Invalid filters or pagination}
        "503": {description: Catalogue unavailable}
  /v1/clips/{id}:
    get:
      operationId: getClip
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, pattern: "^clip-[0-9]{6}$"}}
      responses:
        "200": {description: Clip metadata}
        "404": {description: Clip not found}
        "503": {description: Catalogue unavailable}
  /v1/clips/{id}/storyboard:
    get:
      operationId: getStoryboard
      description: |
        Public immutable WebP 320px previews of a normalized clip, sampled
        evenly across the selected source window. Older clips yield frames: [].
        Original source_start/source_end are optional source metadata returned
        by getClip; storage.storyboard_urls is an optional clip schema field.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, pattern: "^clip-[0-9]{6}$"}}
      responses:
        "200":
          description: Verified storyboard frame URLs and relative timestamps
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StoryboardResponse"}
        "404": {description: Clip not found}
        "503": {description: Catalogue unavailable}
  /v1/clips/{id}/download:
    get:
      operationId: downloadClip
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, pattern: "^clip-[0-9]{6}$"}}
      responses:
        "302": {description: Redirect to verified GitHub Releases media}
        "404": {description: Clip not found}
        "503": {description: Catalogue unavailable}
  /v1/script:
    post:
      operationId: resolveScript
      description: |
        M23 resolves up to 50 script scenes to verified video clips. Uses
        existing lexical/semantic search, filters and import_if_missing quota.
        An import can be queued with a deterministic request_id. Each scene
        reports matched, queued or missing without failing the entire script.
        All output media URLs are HTTPS video assets, never unlabelled images.
        The same input yields the same script_id.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ScriptRequest"}
      responses:
        "200":
          description: Per-scene resolution, preview and provenance
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScriptResponse"}
        "400": {description: Invalid script or body over 64 KiB}
        "405": {description: Method not allowed}
  /v1/search:
    post:
      operationId: search
      description: |
        Public catalogue search. filters.import_if_missing=true may queue a
        bounded import after quota and GitHub dispatch confirmation; no bearer
        required for the public search route. M22 combina ranking semantico
        con ranking de terminos via RRF (k=60). Devuelve semantic
        ready/pending/unavailable y scores por clip si hay vector disponible.
        Sin vectores conserva busqueda lexica y puede despachar codificacion.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SearchBody"}
      responses:
        "200":
          description: Existing paginated results with semantic status
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SearchResponse"}
        "202": {description: Import accepted; includes deterministic request_id}
        "400": {description: Invalid input}
        "409": {description: Unexpired terminal retry budget}
        "429": {description: Import quota or dispatch rate limited}
        "503": {description: Catalogue, GitHub or jobs unavailable}
  /v1/jobs/{request_id}:
    get:
      operationId: getJob
      parameters:
        - {name: request_id, in: path, required: true, schema: {type: string, pattern: "^[0-9a-f]{64}$"}}
      responses:
        "200":
          description: Existing durable job
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Job"}
        "400": {description: Invalid request_id}
        "404": {description: Job does not exist}
        "503": {description: Job storage unavailable}
  /v1/import:
    post:
      operationId: importClip
      security: [{writeToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SearchBody"}
      responses:
        "200": {description: Existing terminal result}
        "202": {description: Import accepted}
        "400": {description: Invalid input}
        "401": {description: Write token required}
        "409": {description: Retry budget exhausted temporarily}
        "429": {description: Quota or GitHub rate limit}
        "503": {description: Dispatch or job storage unavailable}
  /v1/contributions:
    post:
      operationId: contribute
      description: |
        Public endpoint creates a GitHub Issue, then the Issue workflow triggers
        automatic guarded ingestion. Successful Issue creation does not mean
        the media has yet been published.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ContributionBody"}
      responses:
        "201": {description: Issue created; status queued}
        "400": {description: Invalid input}
        "429": {description: Public contribution rate limit}
        "503": {description: Issue service unavailable}
  /v1/videos:
    post:
      operationId: renderVideo
      description: >
        Request a video from a supplied Spanish script (3–12 scenes, up to 60 seconds).
        The serialized script is limited to 60000 characters. The worker does not write the script.
        index_clips controls catalogue indexing, independent of video QA.
      security: [{writeToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VideoRequest"}
      responses:
        "202":
          description: Render accepted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VideoAccepted"}
        "400": {description: Invalid request}
        "401": {description: Write token required}
        "413": {description: Request too large}
        "429": {description: Video quota (one per 5 minutes, 12 per UTC day per IP) or upstream rate limit}
        "503": {description: Actions unavailable}
  /v1/videos/{id}:
    get:
      operationId: getVideoStatus
      security: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, pattern: "^[a-f0-9]{32}$"}}
      responses:
        "200":
          description: State and stage progress; file_url when approved video is available
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VideoStatus"}
        "400": {description: Invalid capability ID}
        "404": {description: Video not found; may be transient after POST, retry status}
        "503": {description: Actions unavailable}
  /v1/videos/{id}/file:
    get:
      operationId: downloadVideo
      security: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, pattern: "^[a-f0-9]{32}$"}}
        - {name: Range, in: header, required: false, schema: {type: string}}
      responses:
        "206": {description: Partial MP4 response, Content-Range and Content-Length}
        "416": {description: Unsatisfiable or unsupported multiple byte ranges}
        "200":
          description: Approved MP4, retained for seven days; supports single byte range
          content:
            video/mp4:
              schema: {type: string, format: binary}
        "400": {description: Invalid capability ID}
        "404": {description: Video not available}
        "410": {description: Video expired}
        "503": {description: Actions unavailable}
